server:
  port: 8080

spring:
  application:
    name: ApiGateWay
  profiles:
    active:
      on-profile: local
  security:
    user:
      name: admin
      password: admin
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
      fail-fast: true
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3001
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: lotuser-service
          uri: lb://lotuser-service
          predicates:
            - Path=/lotuser-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
            - RewritePath=/lotuser-service/(?<segment>.*), /${segment}

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: game-mng-service
          uri: lb://game-mng-service
          predicates:
            - Path=/game-mng-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
            - RewritePath=/game-mng-service/(?<segment>.*), /${segment}

        - id: ticket-sue-service
          uri: lb://TICKET-SUE-SERVICE
          predicates:
            - Path=/ticket-sue-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/ticket-sue-service/(?<segment>.*), /${segment}

        - id: game-lotto645-service
          uri: lb://GAME-LOTTO645-SERVICE
          predicates:
            - Path=/game-lotto645-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/game-lotto645-service/(?<segment>.*), /${segment}

        - id: game-lotto649-service
          uri: lb://GAME-LOTTO649-SERVICE
          predicates:
            - Path=/game-lotto649-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/game-lotto649-service/(?<segment>.*), /${segment}

        - id: game-powerball-service
          uri: lb://GAME-POWERBALL-SERVICE
          predicates:
            - Path=/game-powerball-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/game-powerball-service/(?<segment>.*), /${segment}

        - id: game-cblotto-service
          uri: lb://GAME-CBLOTTO-SERVICE
          predicates:
            - Path=/game-cblotto-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/game-cblotto-service/(?<segment>.*), /${segment}

        - id: producer-service
          uri: lb://PRODUCER-SERVICE
          predicates:
            - Path=/producer-service/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/producer-service/(?<segment>.*), /${segment}

        - id: openapi
          uri: http://cenlots2024-cenlots-api-service:${server.port}
          predicates:
            - Path=/v3/api-docs/**
          filters:
            - RewritePath=/v3/api-docs/(?<segment>.*), /${segment}/v3/api-docs
      default-filters:
        - name: GlobalFilter
          args:
            preLogger: true
            postLogger: true
      discovery:
        locator:
          enabled: true

      httpclient:
        connect-timeout: 30000
        response-timeout: 30000
management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, info
info:
  app:
    name: Spring Cloud Gateway
    description: API Gateway
eureka:
  instance:
    prefer-ip-address: true
    hostname: cenlots2024-discoveryserver-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${spring.security.user.name}:${spring.security.user.password}@${eureka.instance.hostname}:8761/eureka/
  server:
    enableSelfPreservation: false
